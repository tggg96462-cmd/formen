<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Man — Спортивні костюми Adidas</title>
    <style>
        :root {
            --bg-color: #070b12;
            --card-bg: #101622;
            --accent-color: #ff3333;
            --accent-glow: rgba(255, 51, 51, 0.2);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 50px;
            background-image: radial-gradient(circle at 50% 0%, #1a1015 0%, var(--bg-color) 70%);
        }

        header {
            text-align: center;
            padding: 25px 15px;
            background: rgba(7, 11, 18, 0.9);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-color);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .winter-hero {
            text-align: center;
            padding: 30px 15px 15px;
        }

        .winter-hero h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .winter-hero p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .stats-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: rgba(16, 22, 34, 0.8);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            margin: 0 auto 15px;
            max-width: 450px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }
        .stats-badge span {
            color: var(--accent-color);
        }

        .promo-banner {
            background: linear-gradient(90deg, #b30000, #ff3333);
            color: #fff;
            text-align: center;
            padding: 12px;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0 25px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .product-image {
            width: 100%;
            height: 400px;
            background-color: #0d131f;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 14px;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-discount {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent-color);
            color: white;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 13px;
            border-radius: 6px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .product-content {
            padding: 22px;
        }

        .product-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .features-list {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .feature-tag {
            background-color: rgba(255, 51, 51, 0.1);
            color: var(--accent-color);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(255, 51, 51, 0.2);
        }

        .section-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .options-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .option-btn {
            flex: 1;
            min-width: 30%;
            background-color: #162032;
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            font-size: 13px;
            text-align: center;
        }

        .option-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            font-weight: 700;
        }

        .sizes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .size-btn {
            background-color: #162032;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .size-btn.active {
            background-color: white;
            color: black;
            border-color: white;
        }

        .hw-inputs-container {
            background: #162032;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .hw-inputs-row {
            display: flex;
            gap: 10px;
        }
        .hw-inputs-row input {
            margin-bottom: 0 !important;
        }

        .reviews-section {
            margin: 20px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }
        .reviews-title {
            font-size: 13px;
            color: var(--accent-color);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .review-card {
            background: #162032;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-weight: bold;
            color: #fff;
        }
        .review-stars {
            color: #ffc107;
            font-size: 11px;
        }
        .review-text {
            color: var(--text-muted);
            font-size: 12px;
        }

        .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .old-price {
            font-size: 16px;
            color: var(--text-muted);
            text-decoration: line-through;
            margin-right: 10px;
        }

        .price {
            font-size: 22px;
            font-weight: 900;
            color: white;
        }

        .price span {
            color: var(--accent-color);
            font-size: 26px;
        }

        .order-form input {
            width: 100%;
            padding: 12px 15px;
            background-color: #162032;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .order-form input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .phone-input-wrapper {
            display: flex;
            align-items: center;
            background-color: #162032;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .phone-prefix {
            padding: 12px 10px;
            background-color: #1e293b;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: bold;
            border-right: 1px solid var(--border-color);
        }

        .phone-input-wrapper input {
            border: none;
            margin-bottom: 0;
            background: transparent;
        }

        .phone-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: -5px;
            margin-bottom: 10px;
            display: block;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #b30000, #ff3333);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            padding: 15px;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid var(--border-color);
        }
        .modal-content h3 { color: var(--accent-color); margin-bottom: 10px; font-size: 22px; }
        .modal-content p { color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
        .modal-btn {
            background: var(--accent-color); color: white; border: none; padding: 10px 25px;
            font-weight: bold; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FOUR MAN <span>STORE</span></div>
    </header>

    <div class="winter-hero">
        <h1>Спортивні костюми Adidas</h1>
        <p>Преміальна якість, стиль та комфорт на кожен день</p>
    </div>

    <div class="stats-badge">
        <div>📦 <span>1000+</span> виконаних замовлень</div>
        <div>⭐ Оцінка <span>4.8 / 5.0</span></div>
    </div>

    <div class="promo-banner">
        🔥 РОЗПРОДАЖ КОЛЕКЦІЇ: ЗНИЖКА -40% ТІЛЬКИ СЬОГОДНІ 🔥
    </div>

    <div class="container" id="products-container">
        <!-- Товар генерируется через JS -->
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <h3>Дякуємо за замовлення!</h3>
            <p>Менеджер магазину Four Man зв'яжеться з вами найближчим часом для підтвердження.</p>
            <button class="modal-btn" onclick="closeModal()">Зрозуміло</button>
        </div>
    </div>

    <script>
        const product = {
            id: 'adidas-suit',
            name: 'Спортивний костюм Adidas + Шкарпетки у подарунок',
            desc: 'Стильний костюм топ-якості. У комплекті йдуть фірмові шкарпетки Adidas! М\'який та приємний до тіла матеріал.',
            colors: {
                red: { name: 'Червоний', img: 'https://i.postimg.cc/KjYgz0jQ/d1338a048c7d99d9b4a0-jpeg-(1).webp' },
                black: { name: 'Чорний', img: 'https://i.postimg.cc/vTm6B0Tq/dc5f569f48ddcefba5df-jpeg-(1).webp' },
                white: { name: 'Білий', img: 'https://i.postimg.cc/1XzNtvX7/f34743565aea35936f38-png-(1).webp' }
            },
            price: 1750,
            oldPrice: 3000,
            sizes: ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL']
        };

        const reviewsList = [
            { name: 'Олександр Р.', text: 'Костюм бомба! Брав чорний, сіл ідеально, якість матеріалу на висоті ще й шкарпетки в подарунок.' },
            { name: 'Максим К.', text: 'Якість топова, шви рівні, після прання не линяє. Рекомендую однозначно!' },
            { name: 'Дмитро В.', text: 'Брав червоний колір — виглядає дуже стильно, яскраво і зручно.' },
            { name: 'Андрій М.', text: 'Розмір підійшов ідеально завдяки тому що вказав зріст та вагу. Дякую магазину!' },
            { name: 'Сергій Л.', text: 'Швидка доставка, приємна тканина. Взимку чи восени носити одне задоволення.' }
        ];

        const state = {
            color: 'red',
            size: 'M',
            height: '',
            weight: ''
        };

        function initShop() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            let reviewsHtml = '';
            reviewsList.forEach(rev => {
                reviewsHtml += `
                    <div class="review-card">
                        <div class="review-header">
                            <span>${rev.name}</span>
                            <span class="review-stars">★★★★★</span>
                        </div>
                        <div class="review-text">${rev.text}</div>
                    </div>
                `;
            });

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-image">
                    <div class="badge-discount">-40% SALE</div>
                    <img src="${product.colors.red.img}" alt="${product.name}" id="product-img">
                </div>
                <div class="product-content">
                    <div class="product-title">${product.name}</div>
                    <div class="product-desc">${product.desc}</div>

                    <div class="features-list">
                        <span class="feature-tag">🔥 Топ якість</span>
                        <span class="feature-tag">🎁 Шкарпетки в комплекті</span>
                        <span class="feature-tag">⚡ Преміум матеріал</span>
                    </div>

                    <div class="section-title">Оберіть колір:</div>
                    <div class="options-group" id="color-group">
                        <div class="option-btn active" onclick="setColor('red')">Червоний</div>
                        <div class="option-btn" onclick="setColor('black')">Чорний</div>
                        <div class="option-btn" onclick="setColor('white')">Білий</div>
                    </div>

                    <div class="section-title">Оберіть розмір:</div>
                    <div class="sizes-grid" id="sizes-grid"></div>

                    <div class="section-title" style="color: var(--accent-color); margin-top: 15px;">Обов'язкові дані для підбору розміру:</div>
                    <div class="hw-inputs-container">
                        <div class="hw-inputs-row">
                            <input type="text" id="user-height" placeholder="Зріст (напр. 180 см)" required oninput="state.height = this.value">
                            <input type="text" id="user-weight" placeholder="Вага (напр. 80 кг)" required oninput="state.weight = this.value">
                        </div>
                        <span class="phone-hint" style="margin-top: 5px; margin-bottom: 0;">Вкажіть зріст та вагу для точного підбору розміру менеджером</span>
                    </div>

                    <div class="reviews-section">
                        <div class="reviews-title">💬 Відгуки покупців (4.8
